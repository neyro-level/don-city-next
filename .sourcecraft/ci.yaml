on:
  schedule:
    - workflows: production-uptime-monitor
      interval: 15m
      description: DON CITY public availability probe and SourceCraft issue alert

workflows:
  production-uptime-monitor:
    inputs:
      force_alert:
        type: string
        default: "false"
        description: Set to true only to prove the independent alert path.
    tasks:
      - name: probe-public-production
        env:
          MONITOR_FORCE_ALERT: ${{ inputs.force_alert }}
          MONITOR_URL: https://doncity-home.ru/
        cubes:
          - name: sourcecraft-external-uptime-probe
            script:
              - sh scripts/ci/sourcecraft-uptime-monitor.sh

  registry-auth-probe:
    inputs:
      expected_commit_sha:
        type: string
        required: true
        description: Full lowercase SHA to verify against the connected SourceCraft registry.
    tasks:
      - name: verify-native-registry-access
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          IMAGE_REPOSITORY: pkg.sourcecraft.tech/cr/integrator-p/cn1h8kfcah4l5sn4enbm/don-city-next
        cubes:
          - name: sourcecraft-registry-auth-probe
            script:
              - sh scripts/ci/sourcecraft-registry-auth-probe.sh

  merge-standard:
    inputs:
      expected_commit_sha:
        type: string
        required: true
        description: Full lowercase SHA of the Pull Request head to attest.
    tasks:
      - name: attest-exact-head
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
        cubes:
          - name: verify-sourcecraft-commit
            script:
              - sh scripts/verify-sourcecraft-gate.sh

  merge-risky:
    inputs:
      expected_commit_sha:
        type: string
        required: true
        description: Full lowercase SHA of the Pull Request head to attest.
    tasks:
      - name: attest-exact-head
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
        cubes:
          - name: verify-sourcecraft-commit
            script:
              - sh scripts/verify-sourcecraft-gate.sh
              - corepack enable
              - pnpm install --frozen-lockfile
              - pnpm verify:final-release-contract

  release-main:
    inputs:
      expected_commit_sha:
        type: string
        required: true
        description: Full lowercase SHA of the exact current canonical main commit.
    tasks:
      - name: attest-exact-public-main
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          IMAGE_REPOSITORY: pkg.sourcecraft.tech/cr/integrator-p/cn1h8kfcah4l5sn4enbm/don-city-next
        cubes:
          - name: verify-release-main
            script:
              - sh scripts/verify-sourcecraft-release.sh
          - name: build-and-publish-sourcecraft-images
            script:
              - sh scripts/ci/sourcecraft-image-publish.sh
